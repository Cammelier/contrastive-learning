# @package _global_

name: "stl10_simclr_baseline"
experiment_type: "self_supervised"

# Hyperparameters configuration
temperature: 0.07
learning_rate: 0.0003

model:
  projection_head:
  out_dim: 128
  hidden_dim: 512

  # Specific configuration for pre-training
  loops: 
   contrastive:
    training: 
      epochs: 100
      early_stopping: 
        patience: 15
        min_delta: 0.0001
     
data: 
  augmentation:
    color_jitter: 1.0