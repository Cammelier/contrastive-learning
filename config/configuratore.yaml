defaults: 
 - data: stl10
 - model: resnet_simclr
 - _self_

seed: 42
device: "cuda"
epochs: 100
learning_rate: 0.0003
batch_size: 32
num_workers: 4
stage: all

experiment:
  mode: "self_supervised"
  supervised: false
  temperature: 0.07

logger:
  project: "contrastive_learning"
  group: ${experiment.mode}