name: contrastive_loop

training: 
  epochs: 1

  dataloader:
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 0
    pin_memory: true
  
  early_stopping:
    patience: 15
    min_delta: 0.0001
  
  validation:
    dataloader:
      batch_size: ${batch_size}
      shuffle: false
      num_workers: 0
      shuffle: false
      pin_memory: true
  
  test: 
    dataloader:
      batch_size: ${batch_size}
      shuffle: false
      num_workers: 0
      pin_memory: true
  
  mixed_precision: true
  