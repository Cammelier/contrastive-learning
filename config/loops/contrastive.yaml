name: contrastive_loop

training: 
  

  dataloader:
    batch_size: ${batch_size}
    shuffle: true
    num_workers: 16
    pin_memory: true
  
  early_stopping:
    patience: 5
    min_delta: 0.001
  
  validation:
    dataloader:
      batch_size: ${batch_size}
      shuffle: false
      num_workers: 16
      pin_memory: true
  
  test: 
    dataloader:
      batch_size: ${batch_size}
      shuffle: false
      num_workers: 16
      pin_memory: false
  
  mixed_precision: true
  